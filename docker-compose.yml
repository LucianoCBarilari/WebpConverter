services:
  webp-converter:
    image: ghcr.io/lucianocbarilari/webp-converter:latest
    build:
      context: .
      dockerfile: WebpConverter/Dockerfile
    container_name: webp-converter
    restart: on-failure
    ports:
      - "${HOST_PORT:-8080}:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - AppOptions__StoragePath=/app/cdn-images
      - AppOptions__PublicUrlPath=/images
      - AppOptions__ImageCompressionQuality=${COMPRESSION_QUALITY}
      - AppOptions__MaxFileSizeBytes=${MAX_FILE_SIZE}
      - LogOptions__FolderPath=/app/Logs
    volumes:
      - ${HOST_CDN_PATH:-./local-cdn}:/app/cdn-images
      - webp-logs:/app/Logs

volumes:
  webp-logs: